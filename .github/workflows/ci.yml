name: Enviro standards OpenSTD diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Diagnose OpenSTD downloader
        shell: bash
        run: |
          set +e
          mkdir -p out
          {
            echo '=== ENV ==='
            python --version
            uname -a
            echo '=== INSTALL ==='
            python -m pip install 'openstd_spider==0.1.1'
            echo '=== VERSION/HELP ==='
            python -m pip show openstd_spider
            openstd_spider --help
            openstd_spider download --help
            echo '=== KNOWN PUBLIC CONTROL INFO ==='
            openstd_spider info 'GB 18030-2022'
            echo "control-info-exit=$?"
            echo '=== KNOWN PUBLIC CONTROL DOWNLOAD ==='
            openstd_spider download 'GB 18030-2022' -o out/GB_18030-2022.pdf
            echo "control-download-exit=$?"
            ls -lh out/GB_18030-2022.pdf 2>&1
            [ -f out/GB_18030-2022.pdf ] && head -c 8 out/GB_18030-2022.pdf | xxd
            echo '=== TARGET INFO ==='
            openstd_spider info 'GB/T 10589-2008'
            echo "target-info-exit=$?"
            echo '=== TARGET DOWNLOAD ==='
            openstd_spider download 'GB/T 10589-2008' -o out/GBT_10589-2008.pdf
            echo "target-download-exit=$?"
            ls -lh out/GBT_10589-2008.pdf 2>&1
            [ -f out/GBT_10589-2008.pdf ] && head -c 8 out/GBT_10589-2008.pdf | xxd
          } > out/diagnostics.txt 2>&1
          cat out/diagnostics.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: OpenSTD-Diagnostics
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
