name: Enviro standards direct official retrieval
on:
  pull_request:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install package and direct-download official GB/T files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'openstd_spider==0.1.1'
          python - <<'PY'
          import asyncio, pathlib, csv, hashlib, site
          import openstd_spider
          from openstd_spider import Gb688Dto, fuck_captcha_impl

          root = pathlib.Path(openstd_spider.__file__).resolve().parent
          p = root / 'request.py'
          p.write_text(p.read_text(encoding='utf-8').replace('follow_redirects=False','follow_redirects=True'), encoding='utf-8')
          # ddddocr 1.5.6 still calls ndarray.tostring(), removed by current NumPy.
          patched = 0
          for sp in site.getsitepackages() + [site.getusersitepackages()]:
              d = pathlib.Path(sp) / 'ddddocr'
              if d.exists():
                  for f in d.rglob('*.py'):
                      s=f.read_text(encoding='utf-8')
                      if '.tostring()' in s:
                          n=s.count('.tostring()'); f.write_text(s.replace('.tostring()','.tobytes()'),encoding='utf-8'); patched += n
          print('patched ddddocr tostring calls:', patched)

          items = [
            ('GB/T 10589-2008','940D5CBB0996AEB0A62B10521DCC8A56','GBT_10589-2008_低温试验箱技术条件.pdf'),
            ('GB/T 11158-2008','B4F8CB4F59270D773E969789A3E82A00','GBT_11158-2008_高温试验箱技术条件.pdf'),
            ('GB/T 10592-2023','43A98123A5B075565D9C17FCF64095E6','GBT_10592-2023_高低温试验箱技术条件.pdf'),
            ('GB/T 10586-2025','F1EF03245EB82A4733DD97BFFB731E7B','GBT_10586-2025_湿热试验箱技术规范.pdf'),
            ('GB/T 11159-2010','9CF307E2C435CF7E3F85DD66CA731800','GBT_11159-2010_低气压试验箱技术条件.pdf'),
            ('GB/T 10590-2006','C90C5A4A728E7642E5185A37208E80D0','GBT_10590-2006_高低温低气压试验箱技术条件.pdf'),
            ('GB/T 10591-2006','57F8A5B61C8CE9F61C8AEC97595B8B73','GBT_10591-2006_高温低气压试验箱技术条件.pdf'),
            ('GB/T 5170.1-2016','D860E4F76F7F0019B12B6F0EBD592E84','GBT_5170.1-2016_环境试验设备检验方法总则.pdf'),
            ('GB/T 5170.2-2017','F55FAB1073F34CEBDCBE0BC6EF035C39','GBT_5170.2-2017_温度试验设备检验方法.pdf'),
            ('GB/T 5170.5-2016','104B804FFD4EC534A28DAC37102DD7B9','GBT_5170.5-2016_湿热试验设备检验方法.pdf'),
            ('GB/T 5170.10-2017','369CB2C323C121F003BD0C4A8FE0E9C5','GBT_5170.10-2017_高低温低气压试验设备检验方法.pdf'),
            ('GB/T 32710.1-2016','86C6C3E38FD5422F9324CFF232673B68','GBT_32710.1-2016_环境试验仪器设备安全总则.pdf'),
            ('GB/T 32710.2-2016','62AB7A85DBD13D757F835E82060D0B14','GBT_32710.2-2016_低温恒温循环装置安全规范.pdf'),
            ('GB/T 32710.4-2016','8E3C9C79CA506C7777498A4847B04C92','GBT_32710.4-2016_高温恒温循环装置安全规范.pdf'),
            ('GB/T 33861-2017','4A41CC45B9883A4A54C99E7EDBB6AAF0','GBT_33861-2017_高低温试验箱能效测试方法.pdf'),
          ]
          out = pathlib.Path('out/fulltext'); out.mkdir(parents=True, exist_ok=True)
          results=[]
          async def main():
              dto=Gb688Dto()
              try:
                  await fuck_captcha_impl(dto)
                  captcha='ok'
              except Exception as e:
                  captcha=f'fail:{type(e).__name__}:{e}'
              print('captcha:',captcha)
              for std,hc,fn in items:
                  dest=out/fn; status='failed'; err=''
                  if captcha=='ok':
                      try:
                          await asyncio.wait_for(dto.download_pdf(hc,dest), timeout=60)
                          if dest.exists() and dest.stat().st_size>5000 and dest.read_bytes()[:4]==b'%PDF': status='official-fulltext'
                          else: status='invalid'; dest.unlink(missing_ok=True)
                      except Exception as e: err=f'{type(e).__name__}:{e}'; dest.unlink(missing_ok=True)
                  else: err=captcha
                  results.append((std,hc,status,dest.stat().st_size if dest.exists() else 0,fn,err))
          asyncio.run(main())
          pathlib.Path('out').mkdir(exist_ok=True)
          with open('out/RESULTS.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f); w.writerow(['standard','hcno','status','bytes','filename','error']); w.writerows(results)
          with open('out/SHA256SUMS.txt','w',encoding='utf-8') as f:
              for q in sorted(out.glob('*.pdf')): f.write(hashlib.sha256(q.read_bytes()).hexdigest()+'  '+q.name+'\n')
          print(*results,sep='\n')
          PY
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: EnviroEquipment-Official-GBT-Core
          path: out/
          retention-days: 1
          compression-level: 0
