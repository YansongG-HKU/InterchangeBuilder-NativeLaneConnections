name: Enviro official preview PDF reconstruction
on:
  pull_request:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reconstruct GB/T 10589-2008 from official preview
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'openstd_spider==0.1.1'
          python - <<'PY'
          import asyncio, pathlib, importlib.util, tempfile, hashlib
          spec=importlib.util.find_spec('openstd_spider'); root=pathlib.Path(spec.origin).resolve().parent
          for name in ['request.py']:
              p=root/name; p.write_text(p.read_text().replace('follow_redirects=False','follow_redirects=True'))
          p=root/'captcha.py'; p.write_text(p.read_text().replace('img_data.tostring()','img_data.tobytes()'))
          import openstd_spider
          from openstd_spider import Gb688Dto, fuck_captcha_impl, download_preview_img_impl, reorganize_page_impl
          from openstd_spider.parse.gb688 import gb688_uniq_imgid
          from openstd_spider.pdf import async_render_pdf_impl
          out=pathlib.Path('out'); out.mkdir()
          async def main():
              dto=Gb688Dto(); await fuck_captcha_impl(dto)
              pages=await dto.get_pages('940D5CBB0996AEB0A62B10521DCC8A56')
              print('pages',len(pages))
              with tempfile.TemporaryDirectory() as td:
                  td=pathlib.Path(td)
                  ids=gb688_uniq_imgid(pages)
                  await download_preview_img_impl(dto,td,ids)
                  await reorganize_page_impl(pages,td)
                  dest=out/'GBT_10589-2008_低温试验箱技术条件_官方预览重建.pdf'
                  await async_render_pdf_impl(pages,td,dest)
                  print(dest, dest.stat().st_size, dest.read_bytes()[:4])
          asyncio.run(main())
          p=next(out.glob('*.pdf'))
          (out/'SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          PY
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: GBT-10589-Official-Preview-PDF
          path: out/
          retention-days: 1
          compression-level: 0
